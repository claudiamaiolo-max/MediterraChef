<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediterraChef - Ricettario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <div id="app" class="min-h-screen">
        <!-- Header -->
        <header class="p-6 md:p-10 max-w-5xl mx-auto">
            <h1 class="text-4xl font-serif font-bold text-emerald-900 mb-2">MediterraChef</h1>
            <p class="text-stone-600">Archivio ricette anti-spreco e tradizione piemontese.</p>
            <input type="text" id="searchInput" placeholder="Cerca ricetta..." 
                   class="w-full mt-6 p-4 rounded-xl border border-stone-200 shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </header>

        <!-- Griglia -->
        <main id="recipeGrid" class="max-w-5xl mx-auto p-4 md:p-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
            <!-- Le ricette verranno caricate qui via JavaScript -->
        </main>
    </div>

    <script>
        const RECIPES = [
            { title: "Brodo Vegetale a Freddo", category: "Base", cuisine: "Anti-Spreco", time: "48h", difficulty: "Facile", ingredients: ["Bucce di carote", "Bucce di cipolla", "Apici di sedano"], method: "Riunire le verdure in un vaso, coprire con acqua fredda, riposo 48h in frigo." },
            { title: "Bisquits di Mais", category: "Dolci", cuisine: "Paniere Torino", time: "40m", difficulty: "Facile", ingredients: ["Farina 00", "Farina di mais", "Burro", "Latte"], method: "Impastare, tagliare a dischi e infornare a 230°C per 15 min." },
            { title: "Confettura di zucca", category: "Conserve", cuisine: "Anti-Spreco", time: "45m", difficulty: "Media", ingredients: ["Scarti di zucca", "Zucchero", "Limone"], method: "Cuocere con zucchero e limone, frullare e restringere." },
            { title: "Cipolla Piatlina al Forno", category: "Contorni", cuisine: "Paniere Torino", time: "70m", difficulty: "Facile", ingredients: ["Cipolla Piatlina", "Burro", "Salvia", "Miele"], method: "Cartoccio con erbe e burro, 1 ora a 180°C. Servire con miele." },
            { title: "Pesto di sedano", category: "Condimenti", cuisine: "Anti-Spreco", time: "5m", difficulty: "Facile", ingredients: ["Foglie sedano", "Gambi prezzemolo", "Semi di zucca"], method: "Frullare tutto con parmigiano e un filo d'acqua." },
            { title: "Frittata di pane", category: "Piatti Unici", cuisine: "Anti-Spreco", time: "20m", difficulty: "Facile", ingredients: ["Pane raffermo", "Uova", "Latte"], method: "Ammollare il pane, unire uova e formaggio, cuocere in padella." }
        ];

        const grid = document.getElementById('recipeGrid');
        const search = document.getElementById('searchInput');

        function render(filter = '') {
            grid.innerHTML = '';
            const filtered = RECIPES.filter(r => r.title.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border border-stone-100 shadow-sm hover:shadow-md transition-all";
                card.innerHTML = `
                    <h3 class="font-bold text-lg mb-1">${r.title}</h3>
                    <span class="text-xs text-emerald-800 font-bold bg-emerald-50 px-2 py-1 rounded">${r.cuisine}</span>
                    <div class="mt-4 flex gap-4 text-xs text-stone-500">
                        <span>⏱ ${r.time}</span>
                        <span>👨‍🍳 ${r.difficulty}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        search.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
</body>
</html>
