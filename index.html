<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediterraChef - Ricettario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800">

    <div id="app"></div>

    <script type="text/babel">
        const { useState } = React;

        // Archivio esteso con ricette dai PDF
        const RECIPES = [
            { id: 1, title: "Brodo Vegetale a Freddo", cuisine: "Anti-Spreco", time: "48h", difficulty: "Facile", ingredients: ["Bucce di carote", "Bucce di cipolla", "Sedano"], method: "Mettere tutto in acqua fredda per 48h." },
            { id: 2, title: "Bisquits di Mais", cuisine: "Paniere Torino", time: "40min", difficulty: "Facile", ingredients: ["Farina Mais", "Burro", "Latte"], method: "Impastare e cuocere a 230°C." },
            { id: 3, title: "Cipolla Piatlina al Forno", cuisine: "Paniere Torino", time: "70min", difficulty: "Facile", ingredients: ["Cipolla", "Burro", "Salvia"], method: "Al cartoccio a 180°C." },
            { id: 4, title: "Pesto Sedano e Prezzemolo", cuisine: "Anti-Spreco", time: "5min", difficulty: "Facile", ingredients: ["Sedano", "Prezzemolo", "Semi"], method: "Frullare gli ingredienti." },
            { id: 5, title: "Pomodorini, caramello e sesamo", cuisine: "Pomodoro", time: "20min", difficulty: "Media", ingredients: ["Pomodorini", "Zucchero", "Sesamo"], method: "Caramellare i pomodorini." }
        ];

        // Componente Card Ricetta
        const RecipeCard = ({ recipe, onClick }) => (
            <div onClick={() => onClick(recipe)} className="bg-white p-4 rounded-lg shadow border cursor-pointer hover:shadow-md transition">
                <h2 className="font-bold text-lg">{recipe.title}</h2>
                <p className="text-xs text-emerald-700 font-semibold uppercase">{recipe.cuisine}</p>
            </div>
        );

        // Componente Dettaglio
        const RecipeDetail = ({ recipe, onBack }) => (
            <div className="bg-white p-6 rounded-lg shadow animate-in fade-in">
                <button onClick={onBack} className="text-emerald-700 mb-4 font-bold">← Torna all'elenco</button>
                <h2 className="text-2xl font-bold mb-2">{recipe.title}</h2>
                <p className="text-sm font-semibold mb-4 text-emerald-800 uppercase">{recipe.cuisine}</p>
                <h3 className="font-bold mt-4">Ingredienti:</h3>
                <ul className="list-disc ml-5 mb-4">{recipe.ingredients.map((ing, i) => <li key={i}>{ing}</li>)}</ul>
                <h3 className="font-bold">Procedimento:</h3>
                <p className="text-stone-700 leading-relaxed">{recipe.method}</p>
            </div>
        );

        function App() {
            const [view, setView] = useState('list');
            const [selectedRecipe, setSelectedRecipe] = useState(null);

            return (
                <div className="max-w-xl mx-auto p-4 min-h-screen">
                    <header className="mb-8">
                        <h1 className="text-3xl font-bold text-center text-emerald-900">MediterraChef</h1>
                    </header>
                    
                    {view === 'list' ? (
                        <div className="space-y-4">
                            {RECIPES.map(r => <RecipeCard key={r.id} recipe={r} onClick={(r) => { setSelectedRecipe(r); setView('detail'); }} />)}
                        </div>
                    ) : (
                        <RecipeDetail recipe={selectedRecipe} onBack={() => setView('list')} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
